# Low-spec CPU profile. Keep the game client at its normal resolution; the
# detector letterboxes only its input and maps boxes back to client coordinates.
# 只保留与 settings.yaml 不同的项，其余全部通过 extends 继承。
extends: settings.yaml

game:
  target_fps: 10

capture:
  method: "mss"           # requirements-cpu.txt 不含 bettercam，低配固定用 mss

detection:
  backend: onnxruntime
  device: cpu
  cpu_threads: 2
  models:
    main:
      # Generated on the GPU training machine by scripts/export_cpu_onnx.py.
      path: models/cpu/best_dxc_yolo11n_416_fp32.onnx
      imgsz: 416
      conf_threshold: 0.10
      max_det: 300
      class_names:
        - people
        - door
        - monster
        - brand
        - menu
        - article
        - purple_card
        - hero
        - elite
        - boss-n
        - boss-m

debug:
  enabled: false
  save_screenshots: false

dungeon:
  menu_timeout_seconds: 6           # 低配帧率低，超时用真实秒数而非帧计数
  character_button_pos: [960, 540]  # OCR 检不出「选择角色」按钮时的兜底坐标
