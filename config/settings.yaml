# Game Autopilot Configuration

game:
  window_title: "地下城与勇士：创新世纪"  # 游戏窗口标题，需要修改为实际游戏窗口名
  target_fps: 30               # 目标帧率

capture:
  method: "bettercam"          # 屏幕捕获方法: bettercam(DXGI，实测快约 6x，失败自动回退 mss) / mss
  monitor_index: 1             # 显示器索引 (1 = 主显示器)

detection:
  device: "cuda"               # 推理设备: cuda 或 cpu
  models:
    # 主模型配置 - 修改为您的模型路径
    main:
      path: "models/best_yolo26m.pt"   # 主模型 (YOLO26m，验证集 mAP50-95 最高)
      conf_threshold: 0.1      # 置信度阈值
      iou_threshold: 0.1      # IOU阈值

control:
  humanize: true               # 添加人性化延迟（防检测）
  mouse_sensitivity: 1.0       # 鼠标灵敏度
  random_delay_range: [0.02, 0.08]  # 随机延迟范围(秒)

decision:
  # 状态机配置
  states:
    - menu
    - loading
    - playing
    - combat
    - paused
    - dead
    - victory

  # 行为配置
  combat:
    attack_key: "space"        # 攻击按键
    target_priority: "nearest" # 目标优先级: nearest, weakest, strongest
    skill_strategy: "priority" # 技能策略: priority, cooldown, custom
    use_skills: true           # 是否使用技能
    # 遇到某类目标时一次放几个技能；未列出的类别只普攻不放技能
    skill_count_by_class:
      monster: 1
      boss-m: 2
    skill_trigger_interval: 1.0  # 技能触发节流间隔(秒)，防止同一次遭遇瞬间倾泻

  items:
    collect_key: "x"           # 拾取按键
    auto_collect: true         # 自动拾取

# 横版游戏控制配置
side_scroller:
  move_left_key: "left"        # 向左移动按键
  move_right_key: "right"      # 向右移动按键
  attack_key: "x"              # 攻击按键
  attack_range: 150            # 攻击范围(像素)
  approach_threshold: 150       # 靠近阈值(判断是否在正前方)
  attack_interval: 0.15        # 攻击间隔(秒)
  reference_distance: 150      # 像素：角色 press_sleep 对应的参考距离
  max_hold: 1.2                # 单次定时按住时长上限(秒)，超过则改为持续按住



# 地图配置
maps:
  current: "dungeon_1"         # 当前选择的地图ID

  presets:
    dungeon_1:
      name: "暗黑地牢"
      description: "初级副本"
      selection:
        menu_key: "m"
        icon_position: [150, 150]
        scroll_count: 0
        confirm_key: "enter"
      features:
        has_boss: true
        enemy_density: "high"
        item_density: "medium"

    arena:
      name: "竞技场"
      description: "PVP竞技场"
      selection:
        menu_key: "m"
        icon_position: [250, 150]
        scroll_count: 1
        confirm_key: "enter"
      features:
        has_boss: false
        enemy_density: "medium"
        item_density: "low"

debug:
  enabled: true                # 调试模式
  show_detections: true        # 显示检测框
  show_fps: true               # 显示FPS
  show_state: true             # 显示状态
  save_screenshots: true      # 保存截图
  screenshot_interval: 10     # 截图间隔(帧)
  screenshot_dir: "data/screenshots"

hotkeys:
  start: "f1"                  # 启动热键
  pause: "f2"                  # 暂停热键
  stop: "f3"                   # 停止热键

logging:
  level: "INFO"                # 日志级别: DEBUG, INFO, WARNING, ERROR
  log_dir: "logs"
  console_output: true

# ============ DNF 专用配置 ============

# 副本配置
dungeon:
  mode: "new_abyss"           # abyss(深渊), white_map(白图), new_abyss(新深渊)
  max_runs: 16                # 每个角色最大刷图次数
  auto_sell: false            # 自动卖装备
  sell_after_runs: 5          # 刷图多少次后卖装备
  collect_items: true         # 自动拾取
  menu_detect_threshold: 180  # menu连续检测次数超过此值触发角色切换
  character_button_pos: [960, 540]  # 选择角色按钮位置 (x, y)，需要根据实际分辨率调整

# OCR配置 (基于RapidOCR/ONNX Runtime)
ocr:
  enabled: true               # 是否启用OCR检测
  # ONNX模型路径配置（可选，留空使用内置模型）
  det_model_dir: ""           # 文本检测模型路径
  rec_model_dir: ""           # 文本识别模型路径
  cls_model_dir: ""           # 文本方向分类模型路径

# 地图路线配置
map_routes:
  dungeon_1:
    left_doors: [2, 5, 8]     # 这些房间向左走
    up_doors: [3, 6]          # 这些房间向上走
    boss_room: 10             # Boss房间索引
    total_rooms: 10           # 总房间数
  dungeon_2:
    left_doors: [1, 4, 7]
    up_doors: [2, 5]
    boss_room: 9
    total_rooms: 9

# 翻牌配置
card_flip:
  enabled: true
  purple_priority: true       # 紫卡优先
  random_selection: true      # 无紫卡时随机选择

# 卡住检测与分级恢复配置
stuck_recovery:
  # 检测：正在按住方向键，画面却几乎没变
  motion_threshold: 1.0       # 缩放灰度帧间平均绝对差(0-255)低于此值视为"没动"
  stuck_frames: 6             # 连续多少帧没动判定卡住
  sample_width: 160           # 帧差采样宽度(像素)，高度按比例
  crop_top_ratio: 0.12        # 比较时忽略顶部 HUD 的比例
  crop_bottom_ratio: 0.22     # 比较时忽略底部技能栏的比例
  # 分级恢复：探测 → 动作 → 复检 → 升级（确定性升级，非随机）
  stage_duration: 0.45        # 每级恢复动作的最短观察时长(秒)
  max_stages: 4               # 级数: 反向脱离 / 换向绕行 / 跳跃 / 释放重试
  recovery_timeout: 8.0       # 单次恢复总超时(秒)
  recovery_cooldown: 5.0      # 恢复结束后的冷却时间(秒)
  attempt_reset: 3.0          # 正常移动多少秒后把升级级数降回 0
  jump_key: "space"           # 跳跃键

# 定时调度配置
schedule:
  enabled: false              # 是否启用定时任务
  hour: 6                     # 启动时间: 小时
  minute: 0                   # 启动时间: 分钟
  recurring: true             # 是否每日重复

# 多角色配置
multi_character:
  enabled: true              # 是否启用多角色模式
  start_name: ""              # 开始角色名称(可选)
  end_name: ""                # 结束角色名称(可选)
  role_list:
    - id: "DevilMayCry"
      name: "鬼泣"
      dungeon_runs: 16
      move_speed: 1.0          # 移动速度系数, 1.0 基准, >1 更快(快角色调大)
      press_sleep: 0.55        # 参考距离对应的按住时长(秒)
      run_sleep: 0.075         # 最小点按/步进时长(秒)
      art:
